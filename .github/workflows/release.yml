name: 发布 DshForMac

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare:
    name: 校验发布版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 校验标签与项目版本
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [[ "$TAG" == "$version" || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "请使用 v<语义化版本> 标签，例如 v0.1.0。" >&2
            exit 1
          fi
          plist_version="$(sed -n '/<key>CFBundleShortVersionString<\/key>/{n;s/^[[:space:]]*<string>\(.*\)<\/string>$/\1/p;}' Packaging/Info.plist)"
          source_version="$(sed -nE 's/.*static let version = "([^"]+)".*/\1/p' Sources/DshForMac/Models/AppSettings.swift)"
          if [[ "$version" != "$plist_version" || "$version" != "$source_version" ]]; then
            echo "标签版本必须与 Info.plist 和 AppMetadata.version 一致。" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: 从更新日志生成 Release 说明
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [[ ! -s RELEASE_NOTES.md ]]; then
            echo "CHANGELOG.md 中未找到版本 $VERSION 的发布说明。" >&2
            exit 1
          fi

      - name: 上传 Release 说明
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error

  build:
    name: 构建 ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel
            runner: macos-15-intel
            arch: x86_64
          - name: Apple Silicon
            runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 显示 Swift 工具链版本
        run: swift --version

      - name: 运行测试
        run: swift test --arch "${{ matrix.arch }}"

      - name: 构建 release 二进制
        run: swift build -c release --arch "${{ matrix.arch }}"

      - name: 打包 ${{ matrix.name }} 构建产物
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          release_dir=".build/${arch}-apple-macosx/release"
          sparkle_dir=".build/artifacts/sparkle/Sparkle/Sparkle.xcframework/macos-arm64_x86_64"
          tar -czf "release-${arch}.tar.gz" \
            -C "$release_dir" DshForMac DshForMac_DshForMac.bundle \
            -C "$GITHUB_WORKSPACE/$sparkle_dir" Sparkle.framework \
            -C "$GITHUB_WORKSPACE/.build/artifacts/sparkle/Sparkle" bin/generate_appcast

      - name: 上传 ${{ matrix.name }} 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ matrix.arch }}
          path: release-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  package:
    name: 生成通用安装包与更新源
    needs: [prepare, build]
    runs-on: macos-15

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 下载双架构构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: release-build-*
          path: release-builds
          merge-multiple: true

      - name: 合成通用 DMG 并生成已签名更新源
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ github.ref_name }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "缺少 SPARKLE_PRIVATE_KEY 仓库密钥，无法发布可验证的应用更新。" >&2
            exit 1
          fi
          mkdir -p assembled/x86_64 assembled/arm64
          tar -xzf release-builds/release-x86_64.tar.gz -C assembled/x86_64
          tar -xzf release-builds/release-arm64.tar.gz -C assembled/arm64
          DSHFORMAC_VERSION="$VERSION" DSHFORMAC_SKIP_BUILD="1" \
            BINARY_X86_64="$PWD/assembled/x86_64/DshForMac" \
            BINARY_ARM64="$PWD/assembled/arm64/DshForMac" \
            RESOURCE_BUNDLE="$PWD/assembled/arm64/DshForMac_DshForMac.bundle" \
            SPARKLE_FRAMEWORK="$PWD/assembled/arm64/Sparkle.framework" \
            ./scripts/package-dmg.sh
          sparkle_tool="assembled/arm64/bin/generate_appcast"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$sparkle_tool" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            dist
          test -s dist/appcast.xml
          xmllint --noout dist/appcast.xml
          grep -F "DshForMac-${VERSION}-unsigned.dmg" dist/appcast.xml >/dev/null
          grep -F '<sparkle:minimumSystemVersion>11.0</sparkle:minimumSystemVersion>' dist/appcast.xml >/dev/null
          grep -F 'sparkle:edSignature=' dist/appcast.xml >/dev/null
          grep -F 'sparkle-signatures:' dist/appcast.xml >/dev/null

      - name: 上传通用 DMG 与更新源
        uses: actions/upload-artifact@v4
        with:
          name: release-universal
          path: |
            dist/DshForMac-${{ needs.prepare.outputs.version }}-unsigned.dmg
            dist/appcast.xml
          if-no-files-found: error

  release:
    name: 创建 GitHub Release
    needs: [prepare, package]
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 下载 Release 说明
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes

      - name: 下载通用 DMG 与更新源
        uses: actions/download-artifact@v4
        with:
          name: release-universal
          path: release-artifact

      - name: 确保 GitHub CLI 可用
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes gh
          fi
          gh --version

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_files=(release-artifact/*.dmg)
          if [[ ${#dmg_files[@]} -ne 1 || ! -s release-artifact/appcast.xml ]]; then
            echo "应生成一份通用 DMG 和 appcast.xml。" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "发布版本 $TAG 已公开，拒绝覆盖更新包。" >&2
              exit 1
            fi
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes/RELEASE_NOTES.md
            gh release upload "$TAG" "${dmg_files[@]}" release-artifact/appcast.xml --clobber
          else
            gh release create "$TAG" "${dmg_files[@]}" release-artifact/appcast.xml --draft --title "$TITLE" --notes-file release-notes/RELEASE_NOTES.md
          fi
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --prerelease --draft=false
          else
            gh release edit "$TAG" --draft=false
          fi
